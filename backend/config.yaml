    output_tool: create_xlsx
    voice: 节点清晰、责任到人、风险前置；所有日期和状态必须有来源或更新时间。
    suggested_workers: [sup_pmc, sup_buy, sup_qc, sup_wms]
    required_workers: [sup_pmc]
    structure:
      - type: 订单概览
        required: true
        notes: 列：订单号、款号、数量、工厂、下单日期、交期、当前状态、负责人、更新时间。
      - type: 物料到位
        required: true
        notes: 列：物料、供应商、计划到料日、实际到料日、缺口数量、影响订单、跟进动作。
      - type: 生产进度
        required: true
        notes: 列：工序、计划开始、计划完成、实际进度、完成率、异常、责任人、更新时间。
      - type: 质检节点
        required: true
        notes: 列：检验阶段、计划日期、实际日期、检验结果、问题点、整改要求、复检日期。
      - type: 出货与风险
        required: true
        notes: 列：出货批次、计划出货、实际出货、物流方式、延误风险、影响、预案、负责人。
    worker_contribution_map:
      sup_pmc: [订单概览, 生产进度, 出货与风险 总协调]
      sup_buy: [物料到位, 出货与风险 物料风险]
      sup_qc: [质检节点, 出货与风险 质量风险]
      sup_wms: [出货与风险, 订单概览 入库或发运状态]
    quality_gates:
      - 订单、物料、生产、质检、出货五类 sheet 是否齐备
      - 每个关键节点是否包含计划日期、实际状态、负责人和更新时间
      - 物料缺口是否能追溯到供应商、数量和影响订单
      - 风险项是否包含影响、预案和责任人，而非只描述问题
      - 是否避免凭空填写日期；未知节点标注待确认

  - id: qc_aql
    name: 质检标准与AQL检验表
    description: 质检标准和 AQL 检验记录表，覆盖标准、抽样方案、缺陷分级、记录和整改判定。多 sheet Excel。
    triggers:
      - 质检标准
      - AQL
      - 检验表
      - 质量检验
      - 品控标准
      - quality inspection
      - AQL inspection
    output_tool: create_xlsx
    voice: 标准明确、记录可追溯；抽样、缺陷分级和判定必须按 QC 口径执行。
    suggested_workers: [sup_qc, sup_pmc]
    required_workers: [sup_qc]
    structure:
      - type: 检验标准
        required: true
        notes: 列：检验项目、标准要求、检验方法、工具、适用部位、判定规则。
      - type: AQL抽样方案
        required: true
        notes: 列：批量、检验水平、AQL值、抽样数、Ac、Re、适用场景、依据。
      - type: 缺陷分级
        required: true
        notes: 列：缺陷类型、严重等级、定义、示例、判定方式、整改要求。
      - type: 检验记录
        required: true
        notes: 列：批次、款号、抽样数、检验项目、不良数量、缺陷描述、照片编号、检验员、日期。
      - type: 判定与整改
        required: true
        notes: 列：批次、判定结果、主要缺陷、整改要求、责任方、复检日期、关闭状态。
    worker_contribution_map:
      sup_qc: [检验标准, AQL抽样方案, 缺陷分级, 检验记录, 判定与整改]
      sup_pmc: [判定与整改 生产协调, AQL抽样方案 批量信息]
    quality_gates:
      - AQL抽样方案是否包含批量、检验水平、AQL值、抽样数、Ac 和 Re
      - 缺陷分级是否区分严重、主要、次要缺陷并给出示例
      - 检验记录是否能追溯到批次、款号、检验员和日期
      - 判定与整改是否包含责任方、复检日期和关闭状态
      - 是否避免用笼统合格标准替代可检查的判定规则

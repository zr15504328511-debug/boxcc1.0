# boxcc Python Backend Configuration
config_version: 1

models:
  - name: gpt-5.5
    display_name: GPT-5.5 (ikuncode)
    use: langchain_openai:ChatOpenAI
    model: gpt-5.5
    api_key: $IKUNCODE_API_KEY
    base_url: https://api.ikuncode.cc/v1
    max_tokens: 8192
    temperature: 0.7

agents:
  max_concurrent: 6
  timeout_seconds: 1800

  # 扁平 agent 注册表（18 specialist + 1 critic = 19）。
  # 每条 entry 对应 agentspecs/<id>.md 的一份 specialist spec；
  # 详细 role 画像参考 agentspecs/roles/role-NN-*.md。
  # 新增 agent 只需在末尾追加一条 + 写一份 spec.md，无需改 Python。
  registry:
    # --- 商品中心 ---
    - id: mer_plan
      name: 商品企划
      one_liner: 货盘策略、品类宽深、价格带、波段、商业角色定义
      tags: [merchandise, planning, otb]
      spec_path: agentspecs/mer_plan.md
      kb_refs: [product_catalog_kb, sales_inventory_kb]
      max_turns: 20

    - id: mer_ops
      name: 商品运营
      one_liner: SKU 售罄/动销、补调退砍清、库存健康、价格调整
      tags: [merchandise, inventory, replenishment]
      spec_path: agentspecs/mer_ops.md
      kb_refs: [product_catalog_kb, sales_inventory_kb]
      max_turns: 20

    # --- 供应链中心 ---
    - id: sup_buy
      name: 采购
      one_liner: 面辅料/成品采购、RFQ、PO、供应商管理、合同与对账
      tags: [sourcing, supplier, contract]
      spec_path: agentspecs/sup_buy.md
      kb_refs: [supplier_capacity_kb, fabric_test_kb, compliance_contract_kb]
      max_turns: 20

    - id: sup_pmc
      name: 生产协调
      one_liner: 排产、物料齐套、T&A 跟单、外协、翻单可行性
      tags: [production, pmc, leadtime]
      spec_path: agentspecs/sup_pmc.md
      kb_refs: [supplier_capacity_kb, sales_inventory_kb]
      max_turns: 20

    - id: sup_qc
      name: 品质 QC
      one_liner: AQL 抽样、来料/中检/尾检、整改、检测报告判定
      tags: [quality, inspection, defect]
      spec_path: agentspecs/sup_qc.md
      kb_refs: [fabric_test_kb, compliance_contract_kb]
      max_turns: 20

    - id: sup_wms
      name: 仓储物流
      one_liner: 入出库、上架拣货、盘点、库存准确率、发运与退仓
      tags: [warehouse, logistics, wms]
      spec_path: agentspecs/sup_wms.md
      kb_refs: [sales_inventory_kb]
      max_turns: 20

    # --- 渠道中心 ---
    - id: chl_ch
      name: 渠道运营
      one_liner: 经销商/直营批发、回款、串货乱价、区域活动执行
      tags: [channel, distributor, dealer]
      spec_path: agentspecs/chl_ch.md
      kb_refs: [sales_inventory_kb, compliance_contract_kb]
      max_turns: 20

    - id: chl_store
      name: 门店运营
      one_liner: 巡店、陈列、店员培训、连带率、店效与排班
      tags: [retail, store, vmd]
      spec_path: agentspecs/chl_store.md
      kb_refs: [sales_inventory_kb, product_catalog_kb]
      max_turns: 20

    - id: chl_ec
      name: 电商运营
      one_liner: 天猫/抖音/小红书/直播运营、平台规则、活动与投放
      tags: [ecommerce, livestream, platform]
      spec_path: agentspecs/chl_ec.md
      kb_refs: [platform_rules_kb, sales_inventory_kb, product_catalog_kb, brand_content_kb]
      max_turns: 20

    # --- 增长中心 ---
    - id: gro_brand
      name: 品牌营销
      one_liner: 品牌定位、IMC、Campaign、GTM、营销日历与预算
      tags: [brand, campaign, gtm]
      spec_path: agentspecs/gro_brand.md
      kb_refs: [brand_content_kb, platform_rules_kb]
      max_turns: 20

    - id: gro_pr
      name: 公关 PR
      one_liner: 第三方声量、媒体关系、舆情监测、危机口径与声明
      tags: [pr, media, crisis]
      spec_path: agentspecs/gro_pr.md
      kb_refs: [brand_content_kb, compliance_contract_kb]
      max_turns: 20

    - id: gro_content
      name: 内容社媒
      one_liner: 卖点文案、抖音/小红书脚本、爆文复用、KOL/KOC brief
      tags: [content, social, copy]
      spec_path: agentspecs/gro_content.md
      kb_refs: [brand_content_kb, product_catalog_kb, platform_rules_kb, compliance_contract_kb]
      max_turns: 20

    # --- 经营支持中心 ---
    - id: biz_bi
      name: 数据 BI
      one_liner: 指标口径、看板、漏斗分析、归因、专题分析
      tags: [data, bi, metric]
      spec_path: agentspecs/biz_bi.md
      kb_refs: [sales_inventory_kb]
      max_turns: 20

    - id: biz_fin
      name: 财务/成本/预算
      one_liner: 毛利测算、跌价、对账、预算、活动盈亏、应收应付
      tags: [finance, cost, margin]
      spec_path: agentspecs/biz_fin.md
      kb_refs: [sales_inventory_kb, supplier_capacity_kb]
      max_turns: 20

    - id: biz_hr
      name: HR/培训/OD
      one_liner: 招聘、绩效、培训、组织、人效、薪酬
      tags: [hr, training, okr]
      spec_path: agentspecs/biz_hr.md
      kb_refs: []
      max_turns: 20

    - id: biz_voc
      name: 客服 VOC
      one_liner: 退换、客诉、争议处置、责任归因、话术与 SOP
      tags: [service, voc, csat]
      spec_path: agentspecs/biz_voc.md
      kb_refs: [voc_kb, product_catalog_kb]
      max_turns: 20

    - id: biz_legal
      name: 法务/合规
      one_liner: 合同、广告法、GB/三包、PIPL、消费争议、合规审查
      tags: [legal, compliance, contract]
      spec_path: agentspecs/biz_legal.md
      kb_refs: [compliance_contract_kb]
      max_turns: 20

    - id: biz_it
      name: IT/数据中台
      one_liner: ERP/PLM/OMS/WMS、接口、主数据、权限、上线运维
      tags: [it, platform, integration]
      spec_path: agentspecs/biz_it.md
      kb_refs: []
      max_turns: 20

    # --- 风控（critic） ---
    - id: crt
      name: 风控评审
      one_liner: 跨域审查、矛盾消解、合规与口径把关、最终交付决策
      tags: [critic]
      spec_path: agentspecs/crt.md
      kb_refs: [compliance_contract_kb]
      max_turns: 15

lead_agent:
  spec_path: agentspecs/orc.md

summarization:
  enabled: true
  max_token_threshold: 12000
  keep_recent_messages: 8

memory:
  enabled: false
  storage_path: data/memory.json
  debounce_seconds: 30
  max_facts: 100
  max_injection_tokens: 2000

title:
  enabled: true
  max_chars: 60

checkpointer:
  type: sqlite
  connection_string: data/checkpoints.db

server:
  host: 127.0.0.1
  port: 18900

# 知识库注册表。orc 在每轮决定是否调用、把哪个 KB 指派给哪个 worker
# （通过 chairman_plan 中各 task_packet 的 kb_refs 字段）。
# retriever: noop 表示尚未接入真实检索后端，返回占位提示。
knowledge_bases:
  - id: product_catalog_kb
    name: 商品与款式知识库
    description: 款号、系列、品类、价格、卖点、尺码颜色、上市波段、生命周期、搭配建议、历史表现
    retriever: noop

  - id: fabric_test_kb
    name: 面辅料与测试知识库
    description: 面料成分、克重、门幅、色牢度、缩水、起球、洗护、辅料规格、检测报告、替代料
    retriever: chroma

  - id: supplier_capacity_kb
    name: 供应商与产能库
    description: 供应商档案、品类能力、报价、MOQ、交期、准交、质量、合同、风险记录
    retriever: noop

  - id: sales_inventory_kb
    name: 销售库存经营数据集
    description: ERP/POS/OMS/WMS/电商平台销售、库存、退货、折扣、毛利、补调退、库龄
    retriever: noop

  - id: platform_rules_kb
    name: 平台规则与营销知识库
    description: 天猫/抖音/小红书等活动规则、指标定义、违规案例、投放/直播/内容打法
    retriever: noop

  - id: brand_content_kb
    name: 品牌内容资产库
    description: 品牌定位、口吻规范、视觉素材、卖点手册、新闻稿、脚本、爆文案例、禁用词
    retriever: chroma

  - id: compliance_contract_kb
    name: 合规与合同知识库
    description: 合同模板、条款库、广告法风险词、GB/行业标准、产品标签、消费者争议案例、授权文件
    retriever: chroma

  - id: voc_kb
    name: VOC 与客诉知识库
    description: 聊天记录摘要、退货原因、差评、客诉证据、处理话术、责任归因、整改闭环
    retriever: noop

# 产物模板库。每个条目定义一种成品的「骨架 + 谁出料 + 怎么评审」：
# - triggers：用户表述里出现这些关键词时，orc 会优先匹配此模板
# - output_tool：最终调用的导出工具
# - structure：成品的章节/版块骨架，orc 据此填 spec
# - worker_contribution_map：每个 worker 的输出归到哪些 section（驱动 chairman_plan）
# - quality_gates：交给 critic 作为审稿 checklist
# 新增产物只需在末尾追加一条，无需改 Python。
deliverable_types:
  - id: management_ppt
    name: 管理层 PPT 汇报
    description: 季度复盘、投资人路演、跨部门会审、新品发布提案。视觉化的 8-15 页 PPT，每页一个想法。
    triggers:
      - PPT
      - ppt
      - 幻灯片
      - 汇报
      - 复盘
      - 会审
      - 提案
      - 发布提案
      - 路演
      - 季度报告
    output_tool: create_management_ppt
    default_theme: editorial
    voice: 克制、专业、数据先行、避免营销腔。每页一个核心结论，用数字 / 卡片 / 短句而不是堆叠 bullet。
    suggested_workers: [gro_brand, gro_content, biz_fin, biz_legal, biz_bi, mer_ops, chl_ec]
    required_workers: []
    structure:
      - type: cover
        required: true
        max_count: 1
        notes: 封面页。meta 里给 title/subtitle/author/date/brand 即可，无需 blocks。
      - type: agenda
        required: true
        max_count: 1
        notes: 议程页，items 为章节名列表（与后续 divider 对齐）。3-5 条。
      - type: divider
        required: false
        min_count: 0
        max_count: 4
        repeats: chapters
        notes: 章节分隔页，title 与 agenda 中对应项一致；intro 一句话引导。
      - type: content
        required: true
        min_count: 3
        max_count: 10
        repeats: ideas
        notes: |
          内容页。每页一个 idea，title + 可选 eyebrow + lead（一句话结论）+ blocks 列表。
          blocks 可用：bullets / cards (最多4)/ callout / kv / paragraph。不要全用 bullets，
          适当混搭 cards (用于核心卖点)+ callout (用于关键风险/边界) + kv (用于规格 / 关键数据)。
      - type: data
        required: false
        min_count: 0
        max_count: 4
        repeats: data_points
        notes: 数据页。title + takeaway 一句话 + chart {type:bar|line|pie, categories/series/labels/values, title}。每页只放一张图。
      - type: closing
        required: true
        max_count: 1
        notes: 收尾页。actions 列表（owner/action/due）+ decisions 列表（待决策问题）。
    worker_contribution_map:
      gro_brand: [系列定位/品牌故事 content, 营销主张 callout]
      gro_content: [内容投放节奏 content, KOL 分层 cards]
      biz_fin: [预算分配 data, 毛利测算 data, 成本边界 callout]
      biz_legal: [合规边界 content (callout), 上线流程 bullets]
      biz_bi: [核心指标 data, 渠道对比 data]
      mer_ops: [产品矩阵 cards, 售罄/库销 data]
      chl_ec: [电商节奏 data, 平台分货 data]
    quality_gates:
      - 是否包含 cover + agenda + closing（缺一即不合格）
      - 章节分隔页是否与 agenda 列表对齐
      - 是否至少 1 张 data slide 用真实数字驱动（避免纯口号）
      - 每个 content slide 是否有 lead 一句话结论（不是只列 bullets）
      - 是否出现绝对化词（最、第一、永远、100%）—— 出现即返工
      - 财务/成本数据是否有 biz_fin 的输入支撑（不能凭空造数）
      - closing 是否同时给出 actions 和 decisions（执行项 + 待决项）

  - id: product_detail_page
    name: 商品详情页
    description: 单品详情页 HTML，用于电商上线、内部审稿、私域 H5。结构化、可验证、合规友好。
    triggers:
      - 详情页
      - 商品页
      - 产品页
      - 卖点页
      - landing
      - product page
      - PDP
    output_tool: create_product_detail_page
    default_theme: ""  # 当前 PDP 用 product_detail.py 内置主题；模板不强制
    voice: 真实、克制、场景化。避免绝对化与无法证明的卖点，每条卖点都能在面料/检测/吊牌里找证据。
    suggested_workers: [gro_content, gro_brand, biz_legal, mer_plan, biz_voc, sup_qc]
    required_workers: [gro_content, biz_legal]
    structure:
      - type: hero
        required: true
        max_count: 1
        notes: |
          头部：product_name + tagline + category chip + season + price/original_price。
          tagline 不要是品牌口号，要是「这件衣服在用户日常的位置」一句话。
      - type: highlights
        required: true
        min_count: 3
        max_count: 6
        repeats: selling_points
        notes: |
          核心卖点卡片。每张 = icon + title + desc。icon 用 emoji，title 4-10 字，desc 12-30 字。
          desc 必须可验证（成分/克重/版型/场景），不写「最」「永远」之类。
      - type: fabric
        required: true
        min_count: 3
        max_count: 8
        repeats: spec_rows
        notes: 面料规格表 label/value 对。要包含成分、克重、执行标准、安全类别。
      - type: size_table
        required: true
        max_count: 1
        notes: 尺码表 headers + rows + note。size note 说明测量方式与允差。
      - type: scenes
        required: false
        min_count: 0
        max_count: 5
        repeats: outfit_scenes
        notes: 搭配场景卡片。title (4-8 字场景名) + desc (一句穿搭叙述)。
      - type: care
        required: true
        min_count: 2
        max_count: 6
        repeats: care_items
        notes: 洗护说明 icon + text。覆盖洗涤/漂白/熨烫/晾置/存放。
      - type: faq
        required: true
        min_count: 2
        max_count: 6
        repeats: faq_pairs
        notes: |
          常见问题 q/a。优先包含起球、缩水、尺码偏差、褶皱处理、面料过敏。
          答复要给出执行方法或证据（GB 标准 / 测试等级 / 试穿数据）。
      - type: compliance_note
        required: true
        max_count: 1
        notes: 页脚合规提示：本页内容以吊牌/水洗标/检测报告为准；售后政策见官网。法务必审。
    worker_contribution_map:
      gro_content: [hero tagline, highlights, scenes, faq 文案]
      gro_brand: [hero category positioning, tagline tone]
      biz_legal: [compliance_note, highlights desc 合规过审, faq 答复合规过审]
      mer_plan: [fabric 规格, size_table]
      biz_voc: [faq 选题（基于历史客诉）, care 痛点对齐]
      sup_qc: [fabric 数据（成分/克重/检测）, faq 起球/缩水回答的证据]
    quality_gates:
      - 是否所有必备 section 都有内容（hero/highlights/fabric/size_table/care/faq/compliance_note）
      - highlights 是否每条都有可验证证据（不能只是营销词）
      - 是否出现绝对化词或无法证明的功效（最、永久、100%、零起球、零褪色 等）
      - fabric 是否包含成分、克重、执行标准、安全类别四项基础
      - faq 答复是否给出具体方法或测试依据（不是泛泛的"请联系客服"）
      - compliance_note 是否到位（法务必须过签）

  - id: brand_positioning
    name: 品牌定位文档
    description: 品牌定位与价值主张文档，统一品牌内核、目标客群、差异化与表达边界，供管理层、设计与市场对齐。Word 长文档。
    triggers:
      - 品牌定位
      - 品牌定位文档
      - 价值主张
      - 品牌内核
      - 品牌策略
      - positioning
      - brand positioning
    output_tool: create_docx
    voice: 战略、克制、有依据。避免空泛口号，每个定位主张都要能落到客群、场景或证据。
    suggested_workers: [gro_brand, gro_pr, mer_plan, biz_bi]
    required_workers: [gro_brand]
    structure:
      - type: 品牌概述
        required: true
        notes: 一句话定位 + 品牌使命/愿景。开篇即说清"我们是谁、为谁、解决什么"。
      - type: 目标客群
        required: true
        notes: 核心人群画像（年龄/城市/生活方式/消费能力），要具体可识别，不写"追求品质的人"这类空话。
      - type: 价值主张与差异化
        required: true
        notes: 与主要竞品的差异点 3-5 条，每条给出支撑证据（产品/价格/服务/内容），不堆形容词。
      - type: 品牌个性与调性
        required: true
        notes: 性格关键词 + 语气边界 + 禁用表达。供文案/客服统一口径。
      - type: 产品与价格定位
        required: true
        notes: 主营品类带、价格带与主力价格点；说明与定位的呼应关系。
      - type: 表达与禁区
        required: true
        notes: 可说/不可说清单，合规与绝对化词（最/第一/永远/100%）边界。法务可据此把关。
    worker_contribution_map:
      gro_brand: [品牌概述, 价值主张与差异化, 品牌个性与调性]
      mer_plan: [产品与价格定位]
      biz_bi: [目标客群 数据支撑]
      gro_pr: [表达与禁区]
    quality_gates:
      - 定位是否差异化、可识别（不是"高品质/高性价比"这类放之四海皆准的空话）
      - 目标客群是否具体到可识别的人群，而非泛人群
      - 价值主张每条是否有证据支撑，不靠形容词堆叠
      - 是否给出品类带与价格带
      - 是否明确表达禁区与绝对化词/合规边界
      - 全文是否避免出现绝对化词

  - id: user_persona
    name: 用户画像
    description: 目标用户画像文档，定义核心人群的属性、需求、消费行为与触点，供商品、电商与营销共用。Word 长文档。
    triggers:
      - 用户画像
      - 客群画像
      - 人群画像
      - 目标用户
      - 消费者画像
      - 客户画像
      - persona
    output_tool: create_docx
    voice: 基于数据与事实、标注样本来源；避免刻板印象与无依据的臆断。
    suggested_workers: [biz_bi, biz_voc, gro_brand, mer_plan]
    required_workers: [biz_bi]
    structure:
      - type: 画像概览
        required: true
        notes: 人群命名 + 一句话定义 + 规模/占比。如有多个画像，每个画像各占一节。
      - type: 人口与生活方式
        required: true
        notes: 年龄/城市线级/职业/收入/生活方式与价值观。
      - type: 需求与痛点
        required: true
        notes: 核心需求与未被满足的痛点，要具体到场景，能指向产品或服务动作。
      - type: 消费行为
        required: true
        notes: 客单价、购买频次、品类偏好、决策因素与价格敏感度，需有数据支撑。
      - type: 触点与渠道
        required: true
        notes: 信息获取渠道、购买渠道、内容偏好，指导投放与运营。
      - type: 数据来源与置信度
        required: true
        notes: 样本来源、采集时间、样本量与局限；说明置信度。
    worker_contribution_map:
      biz_bi: [画像概览 规模, 消费行为, 数据来源与置信度]
      biz_voc: [需求与痛点]
      gro_brand: [人口与生活方式, 触点与渠道]
    quality_gates:
      - 是否标注样本来源、采集时间与局限
      - 是否避免无依据的刻板印象
      - 消费行为是否有数据支撑（而非凭感觉）
      - 痛点是否具体、可指向产品/服务动作
      - 是否给出置信度或样本局限说明

  - id: trend_report
    name: 市场趋势报告
    description: 市场与品类趋势报告，归纳风格/品类/价格/渠道趋势，并判断对本品牌的适配性。Word 长文档。
    triggers:
      - 趋势报告
      - 市场趋势
      - 趋势分析
      - 流行趋势
      - 品类趋势
      - 春夏趋势
      - 秋冬趋势
      - trend
    output_tool: create_docx
    voice: 来源可靠、区分事实与判断；趋势必须落到对本品牌的适配建议，不停留在罗列。
    suggested_workers: [gro_brand, mer_plan, biz_bi, chl_ec]
    required_workers: [mer_plan]
    structure:
      - type: 摘要与关键判断
        required: true
        notes: 3-5 条核心趋势结论，先给判断再展开。
      - type: 风格与品类趋势
        required: true
        notes: 具体风格、廓形、品类走向；避免"极简风流行"这类无信息量描述。
      - type: 面料与色彩趋势
        required: false
        notes: 当季面料方向与色彩趋势（如适用）。
      - type: 价格与渠道趋势
        required: true
        notes: 价格带变化、渠道/平台动向，给出具体依据。
      - type: 对本品牌的适配建议
        required: true
        notes: 哪些趋势可跟、哪些不跟，落到具体企划/上新动作。
      - type: 来源与时效
        required: true
        notes: 数据/资料来源、采集时间与局限。
    worker_contribution_map:
      mer_plan: [风格与品类趋势, 对本品牌的适配建议]
      gro_brand: [摘要与关键判断]
      chl_ec: [价格与渠道趋势]
      biz_bi: [来源与时效]
    quality_gates:
      - 趋势是否标注来源与时间
      - 是否区分客观事实与主观判断
      - 是否给出对本品牌的适配建议（非空泛罗列）
      - 价格/渠道趋势是否有具体依据
      - 是否避免绝对化的趋势预测

  - id: competitor_analysis
    name: 竞品分析报告
    description: 竞品对比分析，覆盖定位/价格/产品/渠道/内容，并提炼对本品牌的启示与可执行动作。Word 长文档。
    triggers:
      - 竞品分析
      - 竞品
      - 竞争对手
      - 对标
      - 竞品对比
      - benchmark
      - competitor
    output_tool: create_docx
    voice: 客观、可追溯；竞品数据标注来源与时效，结论必须落到可执行启示，不主观贬损。
    suggested_workers: [gro_brand, mer_plan, chl_ec, biz_bi, biz_fin]
    required_workers: [mer_plan]
    structure:
      - type: 分析范围与对象
        required: true
        notes: 选取的竞品及理由、对比维度清单（保证各竞品可比）。
      - type: 定位与人群对比
        required: true
        notes: 各竞品定位、目标人群与价格区间差异。
      - type: 产品与价格对比
        required: true
        notes: 品类带、价格带、主推款对比；维度一致、可横向比较。
      - type: 渠道与内容对比
        required: false
        notes: 渠道布局与内容/营销打法对比（如适用）。
      - type: 启示与建议
        required: true
        notes: 对本品牌的差距、机会与可执行动作，避免"加强营销"这类空泛建议。
      - type: 数据来源与时效
        required: true
        notes: 截图/数据来源与采集时间。
    worker_contribution_map:
      mer_plan: [产品与价格对比, 启示与建议]
      gro_brand: [定位与人群对比]
      chl_ec: [渠道与内容对比]
      biz_bi: [数据来源与时效]
      biz_fin: [产品与价格对比 价格口径]
    quality_gates:
      - 竞品选择是否给出理由
      - 价格/产品数据是否标注来源与时效
      - 是否避免主观贬损竞品、保持客观
      - 启示与建议是否可执行（非空泛）
      - 对比维度是否一致、可横向比较

  - id: merchandising_plan
    name: 季度商品企划
    description: 季度商品企划文档，规划品类结构、价格带、上新节奏与目标，对齐设计、采购与电商。Word 长文档。
    triggers:
      - 商品企划
      - 季度企划
      - 商品规划
      - 上新计划
      - 货盘规划
      - 选品计划
      - 品类规划
      - merchandising plan
    output_tool: create_docx
    voice: 数据先行、目标可量化；企划动作要挂销售/库存/供应链依据，不臆造数字。
    suggested_workers: [mer_plan, mer_ops, biz_bi, sup_buy, biz_fin]
    required_workers: [mer_plan]
    structure:
      - type: 企划目标
        required: true
        notes: 季度销售/上新/毛利目标，量化到数字与口径。
      - type: 市场与回顾输入
        required: true
        notes: 上季复盘要点、趋势与竞品输入，作为企划依据。
      - type: 品类与价格带规划
        required: true
        notes: 各品类 SKU 数、价格带与主推款，挂销售或库存依据。
      - type: 上新节奏
        required: true
        notes: 波段/月份上新计划与关键节点。
      - type: 供应与风险
        required: false
        notes: 供应链能力、交期与风险预案（如适用）。
      - type: 数据依据
        required: true
        notes: 销售/库存/在途数据来源与采集时间。
    worker_contribution_map:
      mer_plan: [企划目标, 品类与价格带规划, 上新节奏]
      mer_ops: [市场与回顾输入]
      biz_bi: [数据依据]
      sup_buy: [供应与风险]
      biz_fin: [企划目标 毛利口径]
    quality_gates:
      - 目标是否可量化（有数字与口径）
      - 品类/价格规划是否有销售或库存依据
      - 上新节奏是否明确到波段/月份
      - 是否标注数据来源与采集时间
      - 是否避免凭空给数

  - id: inventory_report
    name: 库存分析报告
    description: 库存周报/月报 XLSX，多 sheet 输出库存健康度、滞销、断码断货、补货建议和财务影响。
    triggers:
      - 库存分析
      - 补货建议
      - 滞销
      - 断码
      - 库龄
      - 库销比
      - 补调退
      - 库存周报
    output_tool: create_xlsx
    default_theme: ""  # xlsx 输出不使用视觉主题
    voice: 数据先行、结论靠后、不臆造数字。每个建议必须挂数据依据，并标注数据快照时间、来源和置信度。
    suggested_workers: [biz_bi, mer_ops, sup_wms, biz_fin]
    required_workers: [biz_bi, mer_ops]
    structure:
      - type: summary_sheet
        required: true
        min_count: 1
        max_count: 1
        notes: 总览 sheet。核心指标 KV 表，至少包含数据快照时间、库存总值、库龄结构、售罄率、动销率、库销比和关键结论。
      - type: sku_health_sheet
        required: true
        min_count: 1
        max_count: 1
        notes: SKU 健康度表。列：款号/品类/在库/在途/30天销量/库龄/库销比/状态标签；状态标签要能支撑后续建议。
      - type: slow_movers_sheet
        required: true
        min_count: 1
        max_count: 1
        notes: 滞销榜。聚焦库龄 >90 天或动销明显偏低的 SKU，含原因初判、清仓建议、建议折扣或处理路径。
      - type: stockouts_sheet
        required: true
        min_count: 1
        max_count: 1
        notes: 断码/断货榜。必须到尺码维度，包含可售天数、缺码影响、补货建议优先级和是否可调拨。
      - type: replenishment_sheet
        required: true
        min_count: 1
        max_count: 1
        notes: 补货建议。列：款号/建议补量/置信度/依据；依据要引用销量、库存、在途、交期或活动节奏，不凭空给数。
      - type: finance_impact_sheet
        required: true
        min_count: 1
        max_count: 1
        notes: 财务影响。覆盖跌价计提、资金占用、清仓回流、毛利影响；金额口径必须由 biz_fin 或明确数据源支撑。
    worker_contribution_map:
      biz_bi: [summary_sheet 指标口径, sku_health_sheet 数据清洗, 数据快照时间/来源]
      mer_ops: [sku_health_sheet 状态标签, slow_movers_sheet 清仓建议, stockouts_sheet 断码判断, replenishment_sheet 补货建议]
      sup_wms: [sku_health_sheet 库存准确率提示, stockouts_sheet 仓库/门店可调拨性, 在库/在途校验]
      biz_fin: [finance_impact_sheet 跌价计提, 资金占用, 清仓回流和毛利影响]
    quality_gates:
      - 是否齐备 6 个 sheet（summary/sku_health/slow_movers/stockouts/replenishment/finance_impact）
      - 所有核心数据是否标注来源依据和数据快照时间
      - 是否同时给出补货、清仓、调拨三类建议，而不是只做描述
      - 补货建议是否标注置信度，并说明销量/库存/在途/交期依据
      - 是否包含财务影响（跌价计提、资金占用、清仓回流或毛利影响）
      - 是否避免臆造数字；缺数据时是否明确标注缺口和假设
      - 滞销与断货判断是否有阈值或口径说明（如库龄>90天、可售天数、库销比）
      - SKU 健康度状态标签是否能被后续动作追溯解释

  - id: sales_weekly_report
    name: 销售周报
    description: 周度销售经营分析表，汇总销售概览、渠道、品类、款式表现与下周动作。多 sheet Excel。
    triggers:
      - 销售周报
      - 周报
      - 销售周度
      - 周销售
      - 周度销售
      - weekly sales
      - sales weekly report
    output_tool: create_xlsx
    voice: 数据先行、标注数据快照时间、不臆造；结论必须能追溯到表内数据。
    suggested_workers: [biz_bi, mer_ops, chl_ec]
    required_workers: [biz_bi]
    structure:
      - type: 销售概览
        required: true
        notes: KV 表。列或字段包含周期、数据快照时间、GMV、件数、客单、环比、关键结论。
      - type: 分渠道销售
        required: true
        notes: 列：渠道、GMV、件数、客单、占比、环比、主要变化原因。
      - type: 分品类销售
        required: true
        notes: 列：品类、GMV、件数、售罄率、毛利或折扣、环比、机会点。
      - type: TOP与滞销款
        required: true
        notes: 列：款号、款名、品类、销量、GMV、库存、排名类型、原因初判、动作建议。
      - type: 异常与下周建议
        required: true
        notes: 列：异常项、影响范围、数据依据、原因判断、下周动作、负责人。
    worker_contribution_map:
      biz_bi: [销售概览, 分渠道销售, 分品类销售, TOP与滞销款 数据口径, 数据快照时间]
      mer_ops: [TOP与滞销款 原因初判, 异常与下周建议]
      chl_ec: [分渠道销售 电商渠道解读, 异常与下周建议 电商动作]
    quality_gates:
      - 是否标注统计周期、数据快照时间和数据来源
      - GMV、件数、客单、环比等核心指标是否口径一致
      - TOP与滞销判断是否有销量、库存或售罄率依据
      - 下周建议是否对应具体异常或机会点，不写泛泛建议
      - 是否避免臆造数字；缺数据时明确标注缺口

  - id: promo_review
    name: 促销复盘
    description: 促销或大促活动复盘表，对比目标与实际、渠道效果、商品表现和改进动作。多 sheet Excel。
    triggers:
      - 促销复盘
      - 活动复盘
      - 大促复盘
      - 营销复盘
      - campaign review
      - promo review
      - promotion review
    output_tool: create_xlsx
    voice: 数据先行、目标对照、结论可执行；费用与毛利口径必须有来源支撑。
    suggested_workers: [biz_bi, mer_ops, gro_brand, biz_fin]
    required_workers: [biz_bi, mer_ops]
    structure:
      - type: 活动概览
        required: true
        notes: KV 表。字段包含活动名称、周期、渠道、机制、目标、数据快照时间、核心结论。
      - type: 目标vs实际
        required: true
        notes: 列：指标、目标值、实际值、达成率、差异、差异原因、口径说明。
      - type: 分渠道效果
        required: true
        notes: 列：渠道、流量、转化率、GMV、件数、客单、费用、ROI、主要问题。
      - type: 爆款与拖后腿款
        required: true
        notes: 列：款号、款名、角色、销量、GMV、库存、折扣、贡献或拖累原因。
      - type: 复盘结论与改进建议
        required: true
        notes: 列：结论、证据数据、影响、下次改进动作、负责人、优先级。
    worker_contribution_map:
      biz_bi: [活动概览 数据快照时间, 目标vs实际, 分渠道效果 指标口径]
      mer_ops: [爆款与拖后腿款, 复盘结论与改进建议 商品动作]
      gro_brand: [活动概览 机制与传播, 分渠道效果 内容投放解读]
      biz_fin: [目标vs实际 费用和毛利口径, 分渠道效果 ROI]
    quality_gates:
      - 是否明确活动周期、机制、目标和数据快照时间
      - 目标vs实际是否覆盖达成率和差异原因
      - 费用、ROI、毛利相关数字是否有 biz_fin 或明确来源支撑
      - 爆款与拖后腿款是否有销售、库存或折扣数据支撑
      - 改进建议是否能对应到具体责任方和下一次活动动作

  - id: cost_accounting
    name: 成本核算
    description: 单款或系列成本核算表，拆解物料、加工、其他费用、毛利与价格敏感性。多 sheet Excel。
    triggers:
      - 成本核算
      - 成本测算
      - 单款成本
      - 毛利测算
      - costing
      - cost accounting
      - margin calculation
    output_tool: create_xlsx
    voice: 金额口径由 biz_fin 支撑、不臆造；成本假设、币种、税费和时间点必须写清。
    suggested_workers: [biz_fin, sup_buy, mer_plan]
    required_workers: [biz_fin]
    structure:
      - type: 单款成本构成
        required: true
        notes: 列：款号、款名、版本、成本项、金额、占比、币种、含税口径、来源。
      - type: 物料成本明细
        required: true
        notes: 列：物料编码、物料名称、规格、供应商、用量、单价、损耗率、金额。
      - type: 加工与其他费用
        required: true
        notes: 列：费用项、计价方式、单价、数量或工时、金额、供应商或承担方、备注。
      - type: 毛利测算
        required: true
        notes: 列：售价、成本、平台费或渠道扣点、税费、毛利额、毛利率、口径说明。
      - type: 价格敏感性
        required: false
        notes: 列：售价情景、成本情景、销量假设、毛利率、利润影响、风险提示。
    worker_contribution_map:
      biz_fin: [单款成本构成, 毛利测算, 价格敏感性, 金额口径]
      sup_buy: [物料成本明细, 加工与其他费用 供应商报价]
      mer_plan: [单款成本构成 款式信息, 价格敏感性 售价情景]
    quality_gates:
      - 所有金额是否标注币种、含税口径、时间点和来源
      - 物料单价与用量是否能追溯到报价、BOM 或采购输入
      - 毛利测算是否列明渠道扣点、税费或其他必要假设
      - 是否避免臆造成本；缺供应商报价时明确标注待确认
      - 价格敏感性是否清楚区分真实数据与情景假设

  - id: service_faq_kb
    name: 客服FAQ知识库
    description: 客服常见问题知识库，沉淀尺码、面料、物流、退换货与质量问题的标准答复。Word 长文档。
    triggers:
      - 客服FAQ
      - FAQ
      - 客服知识库
      - 常见问题
      - 客服话术库
      - service FAQ
      - support knowledge base
    output_tool: create_docx
    voice: 清晰、可执行、以政策和质检依据为准；每条答复给具体方法或依据，不写"请联系客服"。
    suggested_workers: [biz_voc, biz_legal, sup_qc]
    required_workers: [biz_voc]
    structure:
      - type: 尺码与版型
        required: true
        notes: 汇总尺码选择、版型偏差、测量方法和换码建议；答复要能对应尺码表或试穿反馈。
      - type: 面料与洗护
        required: true
        notes: 覆盖成分、手感、厚薄、洗涤、晾晒、熨烫等问题；给出吊牌或洗唛依据。
      - type: 物流与发货
        required: true
        notes: 说明发货时效、拆单、物流更新延迟、异常件处理路径和可承诺边界。
      - type: 退换货政策
        required: true
        notes: 写清退换货条件、周期、运费、影响二次销售的判断和凭证要求。
      - type: 质量(起球缩水掉色)
        required: true
        notes: 分别说明起球、缩水、掉色等场景的判断方法、处理步骤和质检依据。
      - type: 其他常见问题
        required: false
        notes: 收录包装、发票、会员、赠品、活动价等高频问题，保持与现行政策一致。
    worker_contribution_map:
      biz_voc: [尺码与版型, 物流与发货, 退换货政策, 其他常见问题, 高频问题来源]
      biz_legal: [退换货政策, 物流与发货 承诺边界, 其他常见问题 合规审阅]
      sup_qc: [面料与洗护, 质量(起球缩水掉色)]
    quality_gates:
      - 每条答复是否给出具体处理方法、判断标准或政策依据
      - 是否避免使用"请联系客服"作为主要答复
      - 退换货、补偿和承诺边界是否经过 biz_legal 审阅
      - 质量类问题是否有 sup_qc 的检测或质检依据
      - 是否避免绝对化词和超出政策的承诺

  - id: complaint_scripts
    name: 投诉处理话术
    description: 客诉处理标准话术文档，覆盖安抚、分场景处理、升级补偿与合规红线。Word 长文档。
    triggers:
      - 投诉处理
      - 客诉话术
      - 投诉话术
      - 客诉处理
      - complaint
      - complaint scripts
      - service recovery
    output_tool: create_docx
    voice: 同理、克制、可执行；不越权承诺补偿，不使用刺激性或定责过早的表达。
    suggested_workers: [biz_voc, biz_legal]
    required_workers: [biz_voc, biz_legal]
    structure:
      - type: 处理原则
        required: true
        notes: 明确先安抚、再核实、给路径、留记录的处理顺序，以及不同严重度的响应时限。
      - type: 通用安抚话术
        required: true
        notes: 提供可直接使用的开场、致歉、确认信息、解释进展和收尾话术。
      - type: 分场景话术(质量/物流/尺码/服务)
        required: true
        notes: 按质量、物流、尺码、服务体验拆分，每类包含核实问题、答复口径和下一步动作。
      - type: 升级与补偿权限
        required: true
        notes: 写清升级条件、审批角色、可用补偿类型、金额或权益边界和记录要求。
      - type: 红线与合规(不可承诺事项)
        required: true
        notes: 列出不可承认责任、不可承诺时效、不可私下补偿、不可使用的敏感表达。
    worker_contribution_map:
      biz_voc: [处理原则, 通用安抚话术, 分场景话术(质量/物流/尺码/服务), 升级与补偿权限]
      biz_legal: [升级与补偿权限, 红线与合规(不可承诺事项), 分场景话术(质量/物流/尺码/服务) 合规边界]
    quality_gates:
      - 是否覆盖质量、物流、尺码、服务四类核心投诉场景
      - 话术是否包含核实信息和下一步动作，不只表达安抚
      - 补偿权限是否写清审批条件和边界
      - 不可承诺事项是否明确，且经 biz_legal 审阅
      - 是否避免激化矛盾、提前定责或绝对化承诺

